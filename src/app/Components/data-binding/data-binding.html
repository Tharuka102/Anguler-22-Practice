
<!--
  Angular Data Binding Examples

  Data binding connects the TypeScript component
  with the HTML template.
-->


<!-- =========================================
     INTERPOLATION
     ========================================= -->

<table border="1" style="width: 100%">

  <tr>

    <td>

      <!--
        Interpolation uses {{ }}.

        It displays a TypeScript variable
        inside the HTML.
      -->
      {{ productName }}

    </td>


    <td>

      <!--
        Display product price using
        interpolation.
      -->
      <span>
        {{ productPrice }}
      </span>

    </td>


    <!-- =========================================
         ATTRIBUTE / INTERPOLATION
         ========================================= -->

    <td>

      <!--
        The value attribute receives
        the productName using interpolation.
      -->
      <input
        type="text"
        value="{{ productName }}"
      />

    </td>


    <!-- =========================================
         PROPERTY BINDING
         ========================================= -->

    <td>

      <!--
        Property binding uses [ ].

        maxLength is connected to
        maxAlloowedChar.

        If maxAlloowedChar = 5,
        the input allows 5 characters.
      -->
      <input
        type="text"
        [maxLength]="maxAlloowedChar"
      />

    </td>


    <td>

      <!--
        Property binding can set
        the input value.
      -->
      <input
        type="text"
        [value]="productName"
      />

    </td>


    <td>

      <!--
        Dynamic property binding.

        The input type comes from
        the myDynamicType variable.
      -->
      <input
        [type]="myDynamicType"
      />

    </td>

  </tr>


  <!-- =========================================
       EVENT BINDING
       ========================================= -->

  <tr>

    <td>

      <!--
        Event binding uses ( ).

        When the button is clicked,
        showWelcometext() is called.
      -->
      <button
        (click)="showWelcometext()"
      >
        Show Welcome
      </button>

    </td>


    <td>

      <!--
        The change event runs when
        the selected option changes.
      -->
      <select
        (change)="onDropdownChange()"
      >

        <option value="1">One</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
        <option value="4">Four</option>

      </select>

    </td>

  </tr>


  <!-- =========================================
       MOUSE EVENTS
       ========================================= -->

  <tr>

    <td colspan="6">

      <!--
        Mouse events must be written
        as attributes of the div.

        mouseenter:
        Runs when the mouse enters the div.

        mouseover:
        Runs when the mouse moves over the div.

        mouseout:
        Runs when the mouse leaves the div.
      -->
      <div
        style="
          background-color: red;
          width: 100px;
          height: 100px;
        "
        (mouseenter)="onMouseenter()"
        (mouseover)="onMouseOver()"
        (mouseout)="onMouseOut()"
      >
      </div>

    </td>

  </tr>

</table>


<!-- =========================================
     TWO-WAY DATA BINDING
     ========================================= -->

<table border="1" style="width: 100%">

  <tr>

    <td>

      <!--
        Two-way data binding uses [(ngModel)].

        It connects the HTML input
        and TypeScript variable.

        HTML -> TypeScript
        TypeScript -> HTML
      -->
      <input
        type="text"
        [(ngModel)]="productName"
      />

    </td>


    <td>

      <!--
        Two-way binding can also be
        used with a select element.

        The selected value is stored
        inside productName.
      -->
      <select
        [(ngModel)]="productName"
      >

        <option value="One">One</option>
        <option value="Two">Two</option>
        <option value="Three">Three</option>
        <option value="Four">Four</option>

      </select>

    </td>

  </tr>

</table>


<!-- =========================================
     DISPLAY UPDATED VALUE
     ========================================= -->

<!--
  This value automatically updates
  when productName changes.
-->
<p>
  Selected Product Name:
  {{ productName }}
</p>


<!-- =========================================
     METHODS / FUNCTIONS
     ========================================= -->

<!--
  This button calls the
  changeProductName() method.
-->
<button
  (click)="changeProductName()"
>
  Change Product Name
</button>


<!--
  This button calls the
  changeProductPrice() method.
-->
<button
  (click)="changeProductPrice()"
>
  Change Product Price
</button>


<!--
  Display the current values.
-->
<p>
  Current Product:
  {{ productName }}
</p>

<p>
  Current Price:
  {{ productPrice }}
</p>
